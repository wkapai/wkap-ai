[project]
name = "wkap-ai"
version = "0.1.0"
description = "WKAP V0 Gmail-to-ledger publishing system"
requires-python = ">=3.12"
dependencies = [
  "Django==5.2.15",
  "tzdata>=2025.2",
  "psycopg[binary]>=3.2,<3.3",
  "google-api-python-client>=2.140,<3",
  "google-auth>=2.34,<3",
  "google-auth-oauthlib>=1.2,<2",
  "requests>=2.32,<3",
  "gunicorn>=22,<24",
  "whitenoise>=6.7,<7",
]

[project.scripts]
wkap = "core.entrypoint:main"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wkap_project.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
